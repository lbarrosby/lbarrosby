name: profile
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: profile
  cancel-in-progress: false
jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          git config user.name "Lucas Barros"
          git config user.email "lucasbarros.kam@gmail.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 .github/scripts/upstream.py
            git diff --quiet && exit 0
            git commit -qam "chore: update upstream pull requests"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: output
